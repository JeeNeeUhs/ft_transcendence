basePath: /
definitions:
  publicapi.FriendRequestInput:
    properties:
      username:
        type: string
    type: object
host: localhost:8081
info:
  contact: {}
  description: Public API statistics endpoints for the ft_transcendence project.
  title: ft_transcendence Public API
  version: "1.0"
paths:
  /api/public/me/friend-requests:
    post:
      consumes:
      - application/json
      parameters:
      - description: Target Username
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/publicapi.FriendRequestInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Send friend request
      tags:
      - Public Friends
  /api/public/me/friend-requests/{username}:
    put:
      parameters:
      - description: Requester Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Accept friend request
      tags:
      - Public Friends
  /api/public/me/friends:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - ApiKeyAuth: []
      summary: List friends
      tags:
      - Public Friends
  /api/public/me/friendships/{username}:
    delete:
      parameters:
      - description: Target Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Delete friend or cancel request
      tags:
      - Public Friends
  /api/public/stats/matches:
    get:
      description: Returns the total number of matches played on the platform.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get match statistics
      tags:
      - Public Stats
  /api/public/stats/users:
    get:
      description: Returns the total number of users, 42 Intra users, and users with
        2FA enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get user statistics
      tags:
      - Public Stats
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
