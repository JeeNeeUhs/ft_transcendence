name: "Bug"
description: "Report a bug or unexpected behavior."
title: "bug: <description>"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes: 
      label: Description
      description: Explain the issue, crash, or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: currentbhv
    attributes:
      label: Actual Behavior
      description: What actually happen?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues to avoid duplicates.
          required: true
        - label: I have read the workflow guide.
          required: true
