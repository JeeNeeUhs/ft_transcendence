name: Refactor
description: Propose code improvements without changing behavior.
title: "refactor: <description>"
labels: ["refactor"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what needs to be refactored and the reasons why.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues to avoid duplicates.
          required: true
        - label: I have read the workflow guide.
          required: true
