name: Chore
description: Suggest routine tasks, dependency updates, or config changes.
title: "chore: <description>"
labels: ["chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the routine task or configuration change.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues to avoid duplicates.
          required: true
        - label: I have read the workflow guide.
          required: true
