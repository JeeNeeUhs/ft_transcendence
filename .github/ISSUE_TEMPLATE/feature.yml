name: Feature
description: Suggest a new feature or enhancement.
title: "feat: <description>"
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the new feature or enhancement.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched for existing issues to avoid duplicates.
          required: true
        - label: I have read the workflow guide.
          required: true
