name: Biome

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/biome.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/biome.yml'

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
          working-dir: "./frontend"

      - name: Run Biome
        working-dir: "./frontend"
        run: biome ci .
