services:
  backend:
    build: ./backend
    restart: unless-stopped
    container_name: transcendence_backend
    env_file:
      - .env
    depends_on:
      - database
    networks:
      - transcendence
    ports:
      - "8081:8081"

  database:
    image: postgres:17.6-alpine
    restart: unless-stopped
    container_name: transcendence_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db:/docker-entrypoint-initdb.d
    networks:
      - transcendence

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
    restart: unless-stopped
    container_name: transcendence_frontend
    environment:
      HOSTNAME: ${FRONTEND_HOST}
      PORT: ${FRONTEND_PORT}
    depends_on:
      - backend
    networks:
      - transcendence
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"

networks:
  transcendence:

volumes:
  pgdata:
