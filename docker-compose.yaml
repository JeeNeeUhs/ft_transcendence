services:
  backend:
    build: ./backend
    restart: unless-stopped
    container_name: transcendence_backend
    env_file:
      - .env
    depends_on:
      - database  
    networks:
      - transcendence 
    ports:
      - "8081:8081"

  database:
    image: postgres:17.6-alpine
    restart: unless-stopped
    container_name: transcendence_db
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcendence

# frontend:

networks:
  transcendence:

volumes:
  pgdata:
