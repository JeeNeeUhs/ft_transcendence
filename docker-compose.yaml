services:
  backend:
    build: ./backend
    restart: on-failure
    container_name: transcendence_backend
    env_file:
      - backend/.env
    depends_on:
      - database  
    networks:
      - transcendence 
    ports:
      - "8083:8081"

  
  database:
    image: postgres:15-alpine
    container_name: ft_transcendence_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcendence 

# frontend:

networks:
  transcendence:

volumes:
  pgdata:
